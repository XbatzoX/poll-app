<section class="listedSurveys">
    <header class="listedHeader">
        <div class="listedHeader__btnContainer">
            <button class="listedHeader__btnContainer__btn" [class.isActive]="isActiveSurvey()" (click)="toggleListedSurveys('active')">Active survey</button>
            <button class="listedHeader__btnContainer__btn" [class.isActive]="isPastSurvey()" (click)="toggleListedSurveys('past')">Past survey</button>
        </div>
        <div class="listedHeader__category padding-ss" (mouseenter)="isHoveredArrow = true" (mouseleave)="isHoveredArrow = false"
        (click)="toggleDropdown()">
            <span class="padding-bottom-ss">Sort by categories</span>
            <img [src]="selectArrowPath()" alt="drop down arrow icon">
            @if(isListOpen()){
                <div #dropdownRef class="listedHeader__category__dropdownList padding-s" name="category">  
                    @for (item of categoryList; track item) {
                        <div class="listedHeader__category__dropdownList__item" (click)="selectCategory(item, $event)">
                            {{item}}
                        </div> 
                    }
                </div>
            }
        </div>
    </header>
</section>
