<section class="createSurveyForm">
    <form class="surveyForm">
        <section class="surveyForm__nameDescriptionContainer">
            <fieldset class="surveyForm__fieldset">
                <div class="surveyForm__pair">
                    <label class="surveyForm__label" for="survey-name">Survey name</label>
                    <div class="inputBox">
                        <input type="text" id="survey-name" class="surveyForm__inputField">
                        <button class="deleteBtn" (mouseenter)="isHoveredId = 'survey-name'" (mouseleave)="isHoveredId = ''">
                            <img [src]="changeDeleteIcon('survey-name')" alt="delte icon as trash bin">
                        </button>
                    </div>
                </div>
                <div class="dateContainer">
                    <div class="surveyForm__pair">
                        <label class="surveyForm__label" for="end-date">Set end date <span class="surveyForm__label--optional">(optional)</span></label>
                        <div class="inputBox">
                            <input type="text" id="end-date" class="surveyForm__inputField" (click)="dateInput.showPicker()">
                            <button class="deleteBtn" (mouseenter)="isHoveredId = 'end-date'" (mouseleave)="isHoveredId = ''">
                                <img [src]="changeDeleteIcon('end-date')" alt="delte icon as trash bin">
                            </button>
                        </div>
                        <input type="date" id="hiddenDate" #dateInput class="hiddenDateInput">
                    </div>
                    <div #dropdownRef class="categoryPair" [class.is-open]="isOpen()" (click)="toggleDropdown()"
                    (mouseenter)="isHoveredArrow = true" (mouseleave)="isHoveredArrow = false">
                        <span class="surveyForm__label labelPointer">Choose category</span>
                        <button class="categoryPair__Btn">
                            <img [src]="selectArrowPath()" alt="drop down arrow icon">
                        </button>
                        @if(isOpen()){
                            <div class="categoryPair__dropdownList padding-s" name="category">  
                                @for (item of categoryList; track item) {
                                    <div class="categoryPair__dropdownList__item" (click)="selectCategory(item, $event)">
                                        {{item}}
                                    </div> 
                                }
                            </div>
                        }
                    </div>
                </div>  
            </fieldset>
            <fieldset class="surveyForm__fieldsetDescription">
                <div class="surveyForm__pairDescription">
                    <label class="surveyForm__label" for="end-date">Describing text <span class="surveyForm__label--optional">(optional)</span></label>
                    <div class="inputBoxDescription maxHeight">
                        <textarea name="description" id="description-text" class="surveyForm__inputField"></textarea>
                        <div class="inputBoxDescription__btnContainer">
                            <button class="deleteBtn" (mouseenter)="isHoveredId = 'description-text'" (mouseleave)="isHoveredId = ''">
                                <img [src]="changeDeleteIcon('description-text')" alt="delte icon as trash bin">
                            </button>
                        </div>
                    </div>
                </div>
            </fieldset>
        </section>
        <section class="questionContainer">
           @for(item of questionList; track i; let i = $index){
            <fieldset class="questionContainer__fieldset">
                <div class="questionContainer__questionBox">
                    <div class="questionContainer__labelBox">
                        <label [for]="(i + 1) + '_question'" class="surveyForm__label">{{i + 1}}. Question</label>
                        <button class="deleteBtn" (mouseenter)="isHoveredId = (i + 1) + '_question'" (mouseleave)="isHoveredId = ''">
                            <img [src]="changeDeleteIcon((i + 1) + '_question')" alt="delte icon as trash bin">
                        </button>
                    </div>
                    <input type="text" [id]="(i + 1) + '_question'" class="surveyForm__inputField maxWidth">
                </div>
                <div class="questionContainer__answerBox">
                    <div class="questionContainer__labelBox">
                        <span class="questionContainer__labelBox__text">Answers</span>
                        <div class="questionContainer__labelBox__checkField">
                            <div class="checkboxMultiple">
                                <img src="assets/icons/white_checkbox.svg" alt="checkbox icon">
                            </div>
                            <span class="questionContainer__labelBox__checkField__text">Allow multiple answers.</span>
                        </div>
                    </div>
                    <div class="answersContainer">
                        <div class="answersContainer__answerRow">
                            <label class="surveyForm__label" [for]="(i + 1) + 'q_' + '1_answer'">A.</label>
                            <div class="inputBox">
                                <input type="text" [id]="(i + 1) + 'q_' + '1_answer'" class="surveyForm__inputField">
                                <button class="deleteBtn" (mouseenter)="isHoveredId = (i + 1) + 'q_' + '1_answer'" (mouseleave)="isHoveredId = ''">
                                    <img [src]="changeDeleteIcon((i + 1) + 'q_' + '1_answer')" alt="delte icon as trash bin">
                                </button>
                            </div>
                        </div>
                        <div class="answersContainer__answerRow">
                            <label class="surveyForm__label" [for]="(i + 1) + 'q_' + '2_answer'">B.</label>
                            <div class="inputBox">
                                <input type="text" [id]="(i + 1) + 'q_' + '2_answer'" class="surveyForm__inputField">
                                <button class="deleteBtn" (mouseenter)="isHoveredId = (i + 1) + 'q_' + '2_answer'" (mouseleave)="isHoveredId = ''">
                                    <img [src]="changeDeleteIcon((i + 1) + 'q_' + '2_answer')" alt="delte icon as trash bin">
                                </button>
                            </div>
                        </div>
                        @if(isNewAnswerAvailable()){
                             @for (item of actualList; track item; let j = $index){
                                <div class="answersContainer__answerRow">
                                    <label class="surveyForm__label" [for]="(i + 1) + 'q_' + (j + 3) + '_answer'">{{item}}.</label>
                                    <div class="inputBox">
                                        <input type="text" [id]="(i + 1) + 'q_' + (j + 3) + '_answer'" class="surveyForm__inputField">
                                        <button class="deleteBtn" (mouseenter)="isHoveredId = (i + 1) + 'q_' + (j + 3) + '_answer'" (mouseleave)="isHoveredId = ''">
                                            <img [src]="changeDeleteIcon((i + 1) + 'q_' + (j + 3) + '_answer')" alt="delte icon as trash bin">
                                        </button>
                                    </div>
                                </div>
                            }
                        }
                    </div>
                    <div class="addAnswerInfoContainer">
                        <button class="addQuestionBtn" (click)="addAnswer()">
                            <div class="addQuestionBtn__textBox">
                                <span class="addQuestionBtn__textBox__text">Add answer</span>
                                <img src="assets/icons/add_circle_white.svg" alt="add symbol in a circle">
                            </div>
                            <div class="addQuestionBtn__line"></div>
                        </button>
                        <span class="addAnswerInfoContainer__infoText">{{addAnswerInfo}}</span>
                    </div>
                </div>
            </fieldset>
           }
            <div class="addQuestionBtnContainer">
                <button class="btn btn--secondary" (click)="addNewQuestion()">
                    <span class="addQuestionBtnContainer__btnText">Add next question</span>
                    <img src="assets/icons/add_circle_white.svg" alt="add symbol in circle as icon">
                </button>
            </div>
        </section>
    </form>
</section>
