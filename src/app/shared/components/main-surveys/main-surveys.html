<article class="mainSurveysContainer">
    <span class="mainSurveysContainer__caption padding-bottom-xl">Your surveys</span>
    <div class="surveyListContainer">
        <span class="surveyListContainer__text">Ending soon surveys</span>
        <article class="listContainer">
            @for (survey of dbService.sortedSurveys().slice(0, 3); track survey.id; let i = $index) {
                <div class="listContainer__card" (click)="openSurvey(i)">
                    <div class="listContainer__card__caption">
                        <span class="listContainer__card__caption__category">{{survey.category}}</span>
                        <span class="listContainer__card__caption__name">{{survey.name}}</span>
                    </div>
                    <div class="listContainer__card__dateBox">
                        <span class="listContainer__card__dateBox__text">{{survey.remainingDays}}</span>
                    </div>
                </div>
            }
        </article>
    </div>
</article>
