<article class="newSurveyContainer">
    <div class="newSurveyContent">
        <header class="newSurveyHeader">
            <div class="newSurveyHeader__draftBox">
                <span class="newSurveyHeader__draftText">Draft</span>
            </div>
            <div class="newSurveyCaption">
                <span class="newSurveyCaption__text">Create new survey</span>
                <button class="btn btn--secondary" (click)="cancelDraft()">
                    <span class="newSurveyCaption__btnText">Cancel</span>
                    <img src="assets/icons/close_icon.svg" alt="a cross icon for cancel indication">
                </button>
            </div>
        </header>
        <app-create-survey-form class="appForm"></app-create-survey-form>
        <div class="btnPublishContainer">
            <button class="btn btn--primary">
                <span>Publish</span>
                <img src="assets/icons/check.svg" alt="check icon" class="btn--primary__iconAdd">
            </button>
        </div>
    </div>
</article>
